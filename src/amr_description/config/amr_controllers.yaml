# amr_controllers.yaml
# =====================
# Read by controller_manager (loaded via gz_ros2_control-system, see
# amr_gazebo.xacro). Two controllers are spawned:
#   joint_state_broadcaster - publishes /joint_states (RViz/TF need this)
#   diff_drive_controller   - takes /cmd_vel, drives ONLY the two REAR
#                              wheel joints, publishes /odom. The front
#                              wheels are intentionally absent here -
#                              they're passive, controller_manager never
#                              touches them.
#
# IMPORTANT: wheel_separation and wheel_radius below MUST match the
# geometry actually computed in amr_description.urdf.xacro (verified via
# tf2_echo: y=+-0.179 -> separation 0.358, ground-offset math -> radius
# 0.08). If you ever retune wheel_radius/wheel_ygap/wheel_width again,
# recompute these two numbers the same way and update this file too -
# a mismatch here won't show up as a TF bug, it shows up later as
# odometry drift once you add SLAM/Nav2 on top.

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

joint_state_broadcaster:
  ros__parameters:
    joints:
      - rear_left_wheel_joint
      - rear_right_wheel_joint
      - front_left_wheel_joint
      - front_right_wheel_joint
      # ^ all four listed here so /joint_states (and RViz) reflect the
      # passive front wheels' motion too, even though they're not
      # driven - joint_state_broadcaster just reports state, it doesn't
      # command anything.

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["rear_left_wheel_joint"]
    right_wheel_names: ["rear_right_wheel_joint"]

    wheel_separation: 0.358   # must match amr_description.urdf.xacro
    wheel_radius: 0.08        # must match amr_description.urdf.xacro

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_footprint
    pose_covariance_diagonal: [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: false
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: true

    linear.x.max_velocity: 0.6
    linear.x.min_velocity: -0.6
    linear.x.max_acceleration: 1.0
    angular.z.max_velocity: 1.5
    angular.z.max_acceleration: 3.0